<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trivy Repo Scanner</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        margin: 0;
        padding: 0;
    }
    header {
        background: #0078d7;
        color: white;
        text-align: center;
        padding: 20px;
        font-size: 1.5rem;
        font-weight: bold;
    }
    .container {
        max-width: 1500px;
        margin: 30px auto;
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    form {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
    }
    input[type="text"] {
        flex: 1;
        padding: 10px;
        font-size: 1rem;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    button {
        background: #0078d7;
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 1rem;
        border-radius: 4px;
        cursor: pointer;
    }
    button:hover {
        background: #005fa3;
    }
    #spinner {
        display: none;
        text-align: center;
        margin-top: 20px;
    }
    .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #ccc;
        border-top: 4px solid #0078d7;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: auto;
    }
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }
    th, td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: center;
    }
    th {
        background: #0078d7;
        color: white;
    }
    .badge {
        padding: 4px 8px;
        border-radius: 4px;
        color: white;
        font-weight: bold;
    }
    .high { background: #dc3545; }
    .medium { background: #ffc107; color: black; }
    .low { background: #28a745; }
    #logs {
        margin-top: 20px;
        background: #f9f9f9;
        padding: 10px;
        border-radius: 4px;
        font-family: monospace;
        white-space: pre-wrap;
        border: 1px solid #ddd;
    }
</style>
</head>
<body>
<header>🔍 Trivy Repo Scanner</header>
<div class="container">
    <form id="scanForm">
        <input type="text" id="repoUrl" placeholder="Enter Git repo URL (e.g., https://github.com/aquasecurity/trivy)" required>
        <button type="submit">Scan</button>
    </form>

    <div id="spinner">
        <div class="spinner"></div>
        <p>Scanning repository... Please wait.</p>
    </div>

    <div id="result"></div>
    <div id="logs"></div>
</div>

<script>
document.getElementById("scanForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const repoUrl = document.getElementById("repoUrl").value;
    const formData = new FormData();
    formData.append("repo_url", repoUrl);

    document.getElementById("spinner").style.display = "block";
    document.getElementById("result").innerHTML = "";
    document.getElementById("logs").innerHTML = "";

    try {
        const response = await fetch("http://localhost:8000/scan", {
            method: "POST",
            body: formData
        });

        const data = await response.json();
        document.getElementById("spinner").style.display = "none";

        let scanResult;
        try {
            scanResult = JSON.parse(data.scan_result);
        } catch (err) {
            document.getElementById("result").innerHTML = `<p style="color:red;">Invalid JSON output. Check logs below.</p>`;
            document.getElementById("logs").innerText = data.logs;
            return;
        }

        if (!scanResult.Results || scanResult.Results.length === 0) {
            document.getElementById("result").innerHTML = `<p style="color:green;font-weight:bold;">✅ No vulnerabilities found!</p>`;
            return;
        }

        let html = `<table>
            <thead>
                <tr>
                    <th>Target</th>
                    <th>Vulnerability ID</th>
                    <th>Package</th>
                    <th>Severity</th>
                    <th>Installed Version</th>
                    <th>Fixed Version</th>
                </tr>
            </thead><tbody>`;

        scanResult.Results.forEach(result => {
            if (result.Vulnerabilities) {
                result.Vulnerabilities.forEach(vuln => {
                    const severityClass = vuln.Severity === 'HIGH' ? 'high' :
                                          vuln.Severity === 'MEDIUM' ? 'medium' : 'low';
                    html += `<tr>
                        <td>${result.Target}</td>
                        <td>${vuln.VulnerabilityID}</td>
                        <td>${vuln.PkgName}</td>
                        <td><span class="badge ${severityClass}">${vuln.Severity}</span></td>
                        <td>${vuln.InstalledVersion || 'N/A'}</td>
                        <td>${vuln.FixedVersion || 'N/A'}</td>
                        <td>${vuln.Title || 'No details available'}</td>
                    </tr>`;
                });
            }
        });

        html += "</tbody></table>";
        document.getElementById("result").innerHTML = html;
        document.getElementById("logs").innerHTML = `<h4>Logs:</h4><pre>${data.logs}</pre>`;

    } catch (error) {
        document.getElementById("spinner").style.display = "none";
        document.getElementById("result").innerHTML = `<p style="color:red;">Error: ${error.message}</p>`;
    }
});
</script>
</body>
</html>
